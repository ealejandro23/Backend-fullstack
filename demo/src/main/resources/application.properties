# Configuración del servidor
server.address=0.0.0.0
server.port=${PORT:8080}

# === DATABASE CONFIGURATION ===
# En Render define SPRING_DATASOURCE_URL con formato jdbc:postgresql://...
# Sin variables usa H2 en memoria para desarrollo local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:efa;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Para desarrollo - mostrar más logs
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool de conexiones optimizado para Render
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# H2 Console (desactivada en producción)
spring.h2.console.enabled=false

# === Swagger ===
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# === JSON Serialization ===
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# === Cloudinary (opcional para carga de imágenes) ===
cloudinary.url=${CLOUDINARY_URL:}

# === Security ===
spring.security.user.name=admin
spring.security.user.password=password