name: Build, push y deploy backend (AWS EC2 + ECR)

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: proyecto-efa-backend
  CONTAINER_NAME: proyecto-efa-backend

jobs:

  build:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir tag de imagen
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen Docker
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} .

      - name: Guardar imagen como artifact
        run: docker save ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} -o image.tar

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  push:
    name: Push a ECR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Cargar imagen Docker
        run: docker load -i image.tar

      - name: Configurar credenciales AWS
        if: ${{ vars.DEMO_MODE != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{
